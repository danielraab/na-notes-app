name: CI

# Each implementation gets its own independent job, per /docs/adr — a
# backend or frontend must build and test on its own, with no dependency
# on any other implementation. When a new backend-*/frontend-* folder is
# added, add a job for it here rather than extending an existing one, and
# add a matching filter + output to the `changes` job below.
#
# Every implementation job is gated on the `changes` job: it runs only
# when that implementation's own folder — or this workflow file — changed
# in the push / PR
# (docs/adr/0015-ci-runs-only-changed-implementations.md). A change to a
# single implementation folder never triggers another folder's job.
#
# On push to main, each job that builds an image also pushes it to
# ghcr.io/<owner>/na-notes-<impl>, tagged with a single per-run version
# YYYYMMDD-N that the `changes` job computes
# (docs/adr/0016-ci-publishes-images-to-ghcr.md). Pull requests build the
# images to check the Dockerfile but never push.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  # Gate job: decides which implementation jobs run (per-folder change
  # detection) and, on push to main, mints the one version string every
  # image pushed in this run is tagged with.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the build-YYYYMMDD-N git tag
    outputs:
      version: ${{ steps.version.outputs.version }}
      openapi: ${{ steps.filter.outputs.openapi }}
      backend-go: ${{ steps.filter.outputs.backend-go }}
      backend-rust: ${{ steps.filter.outputs.backend-rust }}
      backend-quarkus: ${{ steps.filter.outputs.backend-quarkus }}
      backend-python: ${{ steps.filter.outputs.backend-python }}
      frontend-react: ${{ steps.filter.outputs.frontend-react }}
      frontend-svelte: ${{ steps.filter.outputs.frontend-svelte }}
      frontend-vue: ${{ steps.filter.outputs.frontend-vue }}
      frontend-angular: ${{ steps.filter.outputs.frontend-angular }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `*pipeline` in every filter: a change to this workflow file
          # re-runs (and, on main, re-publishes) every implementation, so a
          # pipeline change can't ship half-tested.
          filters: |
            pipeline: &pipeline
              - '.github/workflows/ci.yml'
            openapi:
              - *pipeline
              - 'openapi/**'
            backend-go:
              - *pipeline
              - 'backend-go/**'
            backend-rust:
              - *pipeline
              - 'backend-rust/**'
            backend-quarkus:
              - *pipeline
              - 'backend-quarkus/**'
            backend-python:
              - *pipeline
              - 'backend-python/**'
            frontend-react:
              - *pipeline
              - 'frontend-react/**'
            frontend-svelte:
              - *pipeline
              - 'frontend-svelte/**'
            frontend-vue:
              - *pipeline
              - 'frontend-vue/**'
            frontend-angular:
              - *pipeline
              - 'frontend-angular/**'
      # One version string per workflow run, shared by every image pushed
      # in this run so a push that touches several folders produces a
      # matched set (na-notes-backend-go:20260901-3,
      # na-notes-frontend-vue:20260901-3, ...). N is a per-day counter
      # kept in git tags `build-YYYYMMDD-N`; a failed run may burn a
      # number, which is fine. Push to main only — PRs don't push images.
      - name: Compute per-run version and record it as a git tag
        id: version
        if: ${{ github.event_name == 'push' }}
        run: |
          date="$(date -u +%Y%m%d)"
          last="$(git tag -l "build-${date}-*" \
                    | sed "s/^build-${date}-//" \
                    | sort -n | tail -n1)"
          next="$(( ${last:-0} + 1 ))"
          version="${date}-${next}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Build version: ${version}"
          git tag "build-${version}"
          git push origin "build-${version}"

  openapi-lint:
    needs: changes
    if: ${{ needs.changes.outputs.openapi == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @stoplight/spectral-cli lint openapi/openapi.yaml

  backend-go:
    needs: changes
    if: ${{ needs.changes.outputs.backend-go == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: gofmt -l . | tee /tmp/gofmt.out && test ! -s /tmp/gofmt.out
      - run: go test ./...
      - name: Build Docker image
        run: docker build -t na-notes-backend-go .
      - name: Push image to GitHub Container Registry
        if: ${{ github.event_name == 'push' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository_owner }}/na-notes-backend-go:${{ needs.changes.outputs.version }}"
          docker tag na-notes-backend-go "$image"
          docker push "$image"

  backend-rust:
    needs: changes
    if: ${{ needs.changes.outputs.backend-rust == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-rust
    # backend-rust supports SQLite and PostgreSQL as equal first-class
    # engines, so the suite runs against both (see
    # backend-rust/docs/decisions/0002-database-abstraction-layer.md).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rust
      - run: cargo build --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt -- --check
      - name: Test (SQLite)
        run: cargo test
      - name: Test (PostgreSQL)
        env:
          POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: cargo test
      - name: Build Docker image
        run: docker build -t na-notes-backend-rust .
      - name: Push image to GitHub Container Registry
        if: ${{ github.event_name == 'push' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository_owner }}/na-notes-backend-rust:${{ needs.changes.outputs.version }}"
          docker tag na-notes-backend-rust "$image"
          docker push "$image"

  backend-quarkus:
    needs: changes
    if: ${{ needs.changes.outputs.backend-quarkus == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-quarkus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - name: Build Docker image
        run: docker build -t na-notes-backend-quarkus .
      - name: Push image to GitHub Container Registry
        if: ${{ github.event_name == 'push' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository_owner }}/na-notes-backend-quarkus:${{ needs.changes.outputs.version }}"
          docker tag na-notes-backend-quarkus "$image"
          docker push "$image"

  # GraalVM-native build of backend-quarkus (Dockerfile.native, see
  # backend-quarkus/docs/decisions/0005-native-image-build.md). Native-image
  # compilation is slow and RAM-heavy, so unlike the JVM image above this runs
  # only on pushes to main that actually touched backend-quarkus/ — never on
  # PRs or on pushes that changed nothing here (the `changes` job supplies the
  # "touched backend-quarkus/" signal). It always pushes, tagged with the same
  # per-run version as every other image.
  backend-quarkus-native:
    needs: changes
    if: ${{ github.event_name == 'push' && needs.changes.outputs.backend-quarkus == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Dockerfile.native
        working-directory: backend-quarkus
        run: docker build -f Dockerfile.native -t na-notes-backend-quarkus-native .
      - name: Push image to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository_owner }}/na-notes-backend-quarkus-native:${{ needs.changes.outputs.version }}"
          docker tag na-notes-backend-quarkus-native "$image"
          docker push "$image"

  backend-python:
    needs: changes
    if: ${{ needs.changes.outputs.backend-python == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest
      - name: Build Docker image
        run: docker build -t na-notes-backend-python .
      - name: Push image to GitHub Container Registry
        if: ${{ github.event_name == 'push' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository_owner }}/na-notes-backend-python:${{ needs.changes.outputs.version }}"
          docker tag na-notes-backend-python "$image"
          docker push "$image"

  frontend-react:
    needs: changes
    if: ${{ needs.changes.outputs.frontend-react == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint
      - run: npm test
      - run: npm run build
      - name: Build Docker image
        run: docker build -t na-notes-frontend-react .
      - name: Push image to GitHub Container Registry
        if: ${{ github.event_name == 'push' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository_owner }}/na-notes-frontend-react:${{ needs.changes.outputs.version }}"
          docker tag na-notes-frontend-react "$image"
          docker push "$image"

  frontend-svelte:
    needs: changes
    if: ${{ needs.changes.outputs.frontend-svelte == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-svelte
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-svelte/package-lock.json
      - run: npm ci
      - run: npx svelte-check --tsconfig ./tsconfig.app.json
      - run: npx tsc -p tsconfig.node.json
      - run: npx oxlint
      - run: npm test
      - run: npm run build
      - name: Build Docker image
        run: docker build -t na-notes-frontend-svelte .
      - name: Push image to GitHub Container Registry
        if: ${{ github.event_name == 'push' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository_owner }}/na-notes-frontend-svelte:${{ needs.changes.outputs.version }}"
          docker tag na-notes-frontend-svelte "$image"
          docker push "$image"

  frontend-vue:
    needs: changes
    if: ${{ needs.changes.outputs.frontend-vue == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json
      - run: npm ci
      - run: npx vue-tsc -b
      - run: npx oxlint
      - run: npm test
      - run: npm run build
      - name: Build Docker image
        run: docker build -t na-notes-frontend-vue .
      - name: Push image to GitHub Container Registry
        if: ${{ github.event_name == 'push' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository_owner }}/na-notes-frontend-vue:${{ needs.changes.outputs.version }}"
          docker tag na-notes-frontend-vue "$image"
          docker push "$image"

  frontend-angular:
    needs: changes
    if: ${{ needs.changes.outputs.frontend-angular == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint
      - run: npm test
      - run: npm run build
      - name: Build Docker image
        run: docker build -t na-notes-frontend-angular .
      - name: Push image to GitHub Container Registry
        if: ${{ github.event_name == 'push' }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository_owner }}/na-notes-frontend-angular:${{ needs.changes.outputs.version }}"
          docker tag na-notes-frontend-angular "$image"
          docker push "$image"
