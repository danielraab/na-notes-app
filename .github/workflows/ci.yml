name: CI

# Each implementation gets its own independent job, per /docs/adr — a
# backend or frontend must build and test on its own, with no dependency
# on any other implementation. When a new backend-*/frontend-* folder is
# added, add a job for it here rather than extending an existing one.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @stoplight/spectral-cli lint openapi/openapi.yaml

  backend-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: gofmt -l . | tee /tmp/gofmt.out && test ! -s /tmp/gofmt.out
      - run: go test ./...
      - name: Build Docker image
        run: docker build -t na-notes-backend-go .

  backend-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-rust
    # backend-rust supports SQLite and PostgreSQL as equal first-class
    # engines, so the suite runs against both (see
    # backend-rust/docs/decisions/0002-database-abstraction-layer.md).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rust
      - run: cargo build --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt -- --check
      - name: Test (SQLite)
        run: cargo test
      - name: Test (PostgreSQL)
        env:
          POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: cargo test
      - name: Build Docker image
        run: docker build -t na-notes-backend-rust .

  backend-quarkus:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-quarkus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - name: Build Docker image
        run: docker build -t na-notes-backend-quarkus .

  # GraalVM-native build of backend-quarkus (Dockerfile.native, see
  # backend-quarkus/docs/decisions/0005-native-image-build.md). Native-image
  # compilation is slow and RAM-heavy, so unlike the JVM image above this runs
  # only on pushes to main that actually touched backend-quarkus/ — never on
  # PRs or on pushes that changed nothing here. Each build is stamped with a
  # per-day incremental version, YYYYMMDD-N, recorded as a git tag
  # (backend-quarkus-native-YYYYMMDD-N) that also acts as the counter for the
  # next build the same day.
  backend-quarkus-native:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect backend-quarkus changes
        id: changed
        run: |
          before='${{ github.event.before }}'
          if [ -z "$before" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            # First push of the branch / unknown base ref — build to be safe.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$before" '${{ github.sha }}' \
                 | grep -qE '^(backend-quarkus/|\.github/workflows/ci\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No backend-quarkus changes in this push — skipping native build."
          fi
      - name: Generate version tag
        id: version
        if: steps.changed.outputs.changed == 'true'
        run: |
          date="$(date -u +%Y%m%d)"
          last="$(git tag -l "backend-quarkus-native-${date}-*" \
                    | sed "s/^backend-quarkus-native-${date}-//" \
                    | sort -n | tail -n1)"
          next="$(( ${last:-0} + 1 ))"
          echo "tag=${date}-${next}" >> "$GITHUB_OUTPUT"
          echo "Native image version: ${date}-${next}"
      - name: Build Dockerfile.native
        if: steps.changed.outputs.changed == 'true'
        working-directory: backend-quarkus
        run: |
          docker build -f Dockerfile.native \
            -t "na-notes-backend-quarkus-native:${{ steps.version.outputs.tag }}" .
      - name: Record version as a git tag
        if: steps.changed.outputs.changed == 'true'
        run: |
          git tag "backend-quarkus-native-${{ steps.version.outputs.tag }}"
          git push origin "backend-quarkus-native-${{ steps.version.outputs.tag }}"

  backend-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest
      - name: Build Docker image
        run: docker build -t na-notes-backend-python .

  frontend-react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint
      - run: npm test
      - run: npm run build
      - name: Build Docker image
        run: docker build -t na-notes-frontend-react .

  frontend-svelte:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-svelte
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-svelte/package-lock.json
      - run: npm ci
      - run: npx svelte-check --tsconfig ./tsconfig.app.json
      - run: npx tsc -p tsconfig.node.json
      - run: npx oxlint
      - run: npm test
      - run: npm run build
      - name: Build Docker image
        run: docker build -t na-notes-frontend-svelte .

  frontend-vue:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json
      - run: npm ci
      - run: npx vue-tsc -b
      - run: npx oxlint
      - run: npm test
      - run: npm run build
      - name: Build Docker image
        run: docker build -t na-notes-frontend-vue .

  frontend-angular:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint
      - run: npm test
      - run: npm run build
      - name: Build Docker image
        run: docker build -t na-notes-frontend-angular .
