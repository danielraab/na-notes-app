<header class="site-header">
  <div class="site-header-inner">
    <div class="brand-group">
      <a routerLink="/" class="brand">
        <span class="brand-mark">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z" />
            <path d="M14 4v6h6" />
            <path d="M8 13h8M8 17h5" />
          </svg>
        </span>
        <span class="brand-name">NA Notes</span>
      </a>
      <span class="brand-meta">Angular &middot; {{ apiBaseUrl }}</span>
    </div>

    <nav class="site-nav">
      @if (!auth.loading() && auth.user(); as user) {
        <a routerLink="/notes/new" routerLinkActive="is-active" class="btn btn-primary">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg>
          <span class="new-note-label">New note</span>
        </a>

        <div class="user-menu" #menu>
          <button
            type="button"
            class="avatar-button"
            aria-haspopup="menu"
            [attr.aria-expanded]="menuOpen()"
            aria-label="Account menu"
            (click)="toggleMenu()"
          >
            {{ initials(user.displayName) }}
          </button>

          @if (menuOpen()) {
            <div role="menu" class="user-menu-panel">
              <div class="user-menu-identity">
                <p class="user-menu-name">{{ user.displayName }}</p>
                <p class="user-menu-email">{{ user.email }}</p>
              </div>
              <div class="user-menu-actions">
                <button type="button" role="menuitem" class="user-menu-item" (click)="logout()">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <path d="m16 17 5-5-5-5" />
                    <path d="M21 12H9" />
                  </svg>
                  Log out
                </button>
              </div>
            </div>
          }
        </div>
      }
      @if (!auth.loading() && !auth.user()) {
        <button type="button" class="btn btn-primary" (click)="auth.login('/')">Log in</button>
      }
    </nav>
  </div>
</header>
