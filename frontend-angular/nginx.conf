server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (Angular Router): unknown paths fall back to
    # index.html so deep links like /notes/{id} or /shared/{token} work
    # on a hard refresh instead of 404ing at the web server.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
