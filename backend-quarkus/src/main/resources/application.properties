# See docs/decisions/ for why config is wired this way. Every property here
# that mirrors a cross-implementation env var (ADR 0011) resolves against
# that exact env var name via a ${VAR:default} expression, or via
# app.nanotes.backend.config.ListenAddrConfigSource for LISTEN_ADDR (which
# isn't a 1:1 property mapping).

# Root path is left at "/" on purpose: /healthz must live outside /api,
# and every JAX-RS resource in this app declares its own "/api/..." prefix.
quarkus.http.port=8080

# CORS (ADR 0005): only ever reflects an explicitly allow-listed origin,
# never a wildcard, and always paired with credentials.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${ALLOWED_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,If-Match,X-CSRF-Token
quarkus.http.cors.access-control-allow-credentials=true

quarkus.banner.enabled=false

# SMTP (share/mention notifications) — SMTP_* env var names are part of the
# cross-implementation contract (ADR 0011), bridged directly onto Quarkus's
# own mailer config.
quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:25}
quarkus.mailer.username=${SMTP_USERNAME:}
quarkus.mailer.password=${SMTP_PASSWORD:}
quarkus.mailer.from=${SMTP_FROM:NA Notes <notes@example.com>}
quarkus.mailer.auth-methods=DIGEST-MD5 CRAM-SHA256 CRAM-SHA1 CRAM-MD5 PLAIN LOGIN
quarkus.mailer.mock=false
%test.quarkus.mailer.mock=true

# Access logging for local debugging / parity with the other backends'
# per-request log line.
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%{METHOD} %{REQUEST_URL} %{RESPONSE_CODE} %{RESPONSE_TIME}ms

%test.quarkus.http.test-port=0
