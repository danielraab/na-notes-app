quarkusPluginId=io.quarkus
quarkusPluginVersion=3.39.1
quarkusPlatformGroupId=io.quarkus.platform
quarkusPlatformArtifactId=quarkus-bom
quarkusPlatformVersion=3.39.1
kotlinVersion=2.2.21
nimbusJoseJwtVersion=10.9.1
sqliteJdbcVersion=3.53.4.0

org.gradle.jvmargs=-Xmx2g

# The out-of-process Kotlin compile daemon crashes in some sandboxed CI
# environments (JVM/classloader mismatch) but Gradle falls back to
# in-process compilation automatically when it does, so builds still
# succeed — just noisily. Force in-process compilation to skip that
# daemon-spawn-and-fail cycle entirely.
kotlin.compiler.execution.strategy=in-process
